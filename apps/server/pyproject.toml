[project]
name = "leaves-server"
version = "0.1.0"
description = "Local backend for Leaves"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "keyring>=25,<27",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
bundle = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<9"]

[tool.fastapi]
entrypoint = "app.main:app"
